name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  display-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm test && npm run build
      - run: |
          tar -czf presence-pi-${{ github.ref_name }}.tar.gz apps/hub/dist apps/display/dist .env.example
      - uses: actions/upload-artifact@v4
        with: { name: pi, path: "presence-pi-*.tar.gz" }

  android:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/launcher-android }
    env:
      VERSION_NAME: ${{ github.ref_name }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Decode keystore
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:testReleaseUnitTest :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with: { name: launcher-aab, path: "apps/launcher-android/app/build/outputs/bundle/release/*.aab" }

  publish:
    needs: [display-hub, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pi/*.tar.gz
            launcher-aab/*.aab
