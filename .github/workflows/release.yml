name: Release
on:
  push:
    tags: ["v*.*.*"]
# Nothing by default: each job asks only for what it needs (supply-chain hardening, see docs/release.md).
permissions: {}
jobs:
  display-hub:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 } # no cache: a release is built from scratch, never from a cache another run wrote
      - run: npm ci && npm test && npm run build
      # The tag name goes through an environment variable, never into the script text (shell injection via a crafted tag).
      - env: { REF_NAME: "${{ github.ref_name }}" }
        run: tar -czf "simple-pi-${REF_NAME}.tar.gz" apps/hub/dist apps/display/dist .env.example
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: pi, path: "simple-pi-*.tar.gz" }

  # Signs the bundle and uploads it to Play. The "release" environment requires a maintainer's approval before this job starts;
  # it protects the signing and Play secrets only once they are environment secrets (docs/release.md).
  android:
    runs-on: ubuntu-latest
    environment: release
    permissions: { contents: read }
    defaults:
      run: { working-directory: apps/launcher-android }
    env:
      VERSION_NAME: ${{ github.ref_name }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with: { gradle-version: 9.6.0, cache-disabled: true }
      # Secrets are given to the single step that needs each of them, never to the whole job.
      - name: Decode keystore
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # No daemon: it would keep the passwords in its environment, readable by the later steps.
        run: gradle --no-daemon :app:testDebugUnitTest :app:bundleRelease
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: launcher-aab, path: "apps/launcher-android/app/build/outputs/bundle/release/*.aab" }
      - name: Is a Play service account configured?
        id: play
        env: { PLAY_JSON: "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" }
        run: echo "configured=$([ -n "$PLAY_JSON" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Uploads to the *internal testing* track only. Promotion to closed/production is done by hand in Play Console.
      - name: Upload to Google Play (internal testing)
        if: steps.play.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.simple.launcher
          releaseFiles: apps/launcher-android/app/build/outputs/bundle/release/*.aab
          tracks: internal
          status: draft
          whatsNewDirectory: distribution/whatsnew

  publish:
    needs: [display-hub, android]
    runs-on: ubuntu-latest
    permissions: { contents: write } # the only job allowed to write: it creates the GitHub release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            pi/*.tar.gz
            launcher-aab/*.aab
