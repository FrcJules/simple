name: CodeQL
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 4 * * 1" }]
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    # Code scanning is free only on public repos; this activates once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      matrix: { language: [javascript-typescript] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
