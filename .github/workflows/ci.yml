name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.f.outputs.web }}
      android: ${{ steps.f.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: f
        with:
          filters: |
            web:
              - 'apps/hub/**'
              - 'apps/display/**'
              - 'packages/**'
              - 'package*.json'
              - 'eslint.config.js'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            android:
              - 'apps/launcher-android/**'
              - 'scripts/ci-emulator-tests.sh'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      # End-to-end: real hub + built display in Chromium, at the Pi screen sizes (apps/display/e2e, docs/testing.md).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w @simple/display
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: display-screenshots-e2e
          if-no-files-found: warn
          path: |
            apps/display/test-results/screens/**
            apps/display/playwright-report/**

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/launcher-android }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with: { gradle-version: 9.6.0 }
      # roborazzi.test.record: the JVM screenshot tests (ScreenshotsTest) also write their images, uploaded below for review.
      # lintRelease too: the Play build differs (no direct SMS mode, minified) and only the Release workflow builds it.
      - run: gradle :app:lintDebug :app:lintRelease :app:testDebugUnitTest :app:assembleDebug -Proborazzi.test.record=true
      # The app has no Internet access (privacy policy, Play data safety): fail if any dependency brings the permission back.
      - name: No INTERNET permission in the release manifest
        run: |
          gradle :app:processReleaseMainManifest
          manifest=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          test -n "$manifest"
          ! grep -q 'android.permission.INTERNET' "$manifest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-debug-apk
          path: apps/launcher-android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: launcher-screenshots-jvm
          if-no-files-found: warn
          path: apps/launcher-android/app/build/outputs/roborazzi/*.png

  # The 61+ UI tests take ~5 of the ~9 minutes of this job: two emulators each run half of them (AndroidJUnitRunner sharding), in parallel.
  # The SMS tests (which need the default-SMS role) run in shard 0 only. A third shard would add ~3 runner-minutes for ~40 s less.
  android-emulator:
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with: { gradle-version: 9.6.0 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: SHARD=${{ matrix.shard }} NUM_SHARDS=2 bash scripts/ci-emulator-tests.sh
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-screenshots-and-reports-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            apps/launcher-android/app/build/screenshots/**

  # Single required status check for branch protection.
  ci-ok:
    if: always()
    needs: [changes, web, android, android-emulator]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ contains(needs.*.result, 'failure') }}" = "false" ] && [ "${{ contains(needs.*.result, 'cancelled') }}" = "false" ]
